<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-Bus Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<busconfig>
  <!-- cgroupd on the system bus. Daemon runs as root and owns the name;
       any local UID may call; per-call auth is enforced by the daemon
       via GetConnectionUnixUser + resolve_uid.
       After installing, reload the bus with ReloadConfig on
       org.freedesktop.DBus (see README). -->
  <policy user="root">
    <allow own="org.cgroupd"/>
    <allow send_destination="org.cgroupd"/>
  </policy>
  <policy context="default">
    <allow send_destination="org.cgroupd"/>
  </policy>
</busconfig>
