[package]
name = "cgroupd"
version = "0.1.0"
edition = "2024"
license = "GPL-2.0-or-later"

[features]
default = ["dbus"]
dbus = ["dep:dbus"]

[[bin]]
name = "cgroupd"
path = "src/main.rs"

[dependencies]
basic-toml = "0.1.10"
cgroupd-common = { version = "0.1.0", path = "../common" }
dbus = { version = "0.9.12", optional = true }
libc = "0.2.189"
rustix = { version = "1.1", features = ["fs", "process", "net", "stdio", "thread"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
signal-hook = "0.4.6"
uzers = "0.12"
